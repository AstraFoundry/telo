name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: make check
      - name: Build the packaged app
        run: make package
        env:
          TELO_TELEGRAM_API_ID: ${{ secrets.TELO_TELEGRAM_API_ID }}
          TELO_TELEGRAM_API_HASH: ${{ secrets.TELO_TELEGRAM_API_HASH }}
          TELO_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.TELO_GOOGLE_OAUTH_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: telo-${{ matrix.os }}
          path: build/*/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
