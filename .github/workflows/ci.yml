name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # package.json `packageManager` already pins pnpm; passing `version`
      # here would fail the action with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Every gate: gofmt, vet, generated code, FSD/DDD imports, the TDLib
      # capability matrix, telegram-macos parity, the Go tests against the
      # staged libtdjson, and the documentation.
      - run: make check
      - name: UI snapshots
        if: matrix.os == 'ubuntu-latest'
        run: make snapshots
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: ui-snapshots
          path: .workspace/snapshots
          retention-days: 7
